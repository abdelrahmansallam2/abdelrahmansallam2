name: Refresh contribution animation

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml
      - .github/scripts/generate-contribution-chart.mjs

permissions:
  contents: read

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate contribution activity chart
        run: node .github/scripts/generate-contribution-chart.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?color_snake=#0284C7&color_dots=#EBF3F8,#BAE6FD,#7DD3FC,#38BDF8,#0284C7
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0D1726,#12324B,#12597A,#0284C7,#38BDF8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save updated animation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/contribution-activity.svg assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animation is already up to date."
            exit 0
          fi
          git commit -m "Refresh contribution animation"
          git push origin HEAD:main
