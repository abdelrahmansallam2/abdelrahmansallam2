<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Abdelrahman Amin Sallam - Flutter Developer</title>
  <desc id="description">A navy and cyan developer banner featuring mobile interfaces, frontend work, AI-assisted development, and smart-home automation.</desc>
  <defs>
